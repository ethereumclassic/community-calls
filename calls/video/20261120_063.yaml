# Call 63 video settings. All times are on the original recording clock;
# scripts/videogen/edit-audio.mjs applies `edit` and writes the map that
# carries them onto the edited audio.

edit:
  silence:
    minGapSec: 2
    keepSec: 0.75
    thresholdDb: -40

# Highlight before the preroll: Kevin on what Mumbai did for ETC.
coldOpen:
  from: "2:58.85"
  to: "3:10.9"
  # Take out the fillers: "um" after "sparked", then "I don't know".
  cuts:
    - { from: "3:03.9", to: "3:05.35" }
    - { from: "3:06.3", to: "3:07.15" }
  quote: Being in Mumbai and showing a presence in Mumbai has really sparked some life, you could say, back into the ETC sphere.
  src: coldopen-05-gateway-night.webp

# Pages shown while they are discussed (captured into the media cache), and
# the cold-open still when the quote comes round in the call.
displays:
  - from: "1:47.35"
    to: "2:28.27"
    src: page-survey.webp
  - from: "2:58.85"
    to: "3:10.9"
    src: coldopen-05-gateway-night.webp
  - from: "9:25.58"
    to: "10:19.02"
    src: page-reflections-on-mumbai.webp
  - from: "10:19.02"
    to: "10:45.6"
    src: page-twelve-more-months.webp
  - from: "20:11.9"
    to: "20:48.599"
    src: page-node-guide-part-2.webp
  - from: "24:41.46"
    to: "25:30.0"
    src: page-eez.webp
  - from: "41:06.16"
    to: "41:51.369"
    src: page-key-exposure.webp
  - from: "55:51.28"
    to: "56:43.6"
    src: page-skinnycat.webp
  - from: "57:11.52"
    to: "57:49.07"
    src: page-eip-8288.webp
  - from: "1:12:31.75"
    to: "1:14:03.6"
    src: page-survey.webp

# YouTube thumbnail: no guest this call, so show all speakers.
thumbnail:
  faces: all
